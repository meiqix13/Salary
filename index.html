
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body,#wrap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;}
#wrap{padding:16px;max-width:480px;margin:0 auto;}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hdr-title{font-size:22px;font-weight:700;color:#000;letter-spacing:-0.5px;}
.hdr-right{display:flex;gap:8px;}
.ico-btn{width:40px;height:40px;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
.ico-btn.imp{background:#e9e9eb;color:#3c3c43;}
.ico-btn.exp{background:#007aff;color:#fff;}
.hint{background:#fff;border-radius:12px;padding:10px 14px;font-size:12px;color:#8e8e93;margin-bottom:14px;line-height:1.5;}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}
.fld{margin-bottom:14px;}
.fld:last-child{margin-bottom:0;}
.fld-label{font-size:11px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.fld input,.fld select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid #e5e5ea;background:#f9f9f9;font-size:16px;color:#000;font-family:inherit;-webkit-appearance:none;appearance:none;outline:none;}
.fld input:focus,.fld select:focus{border-color:#007aff;background:#fff;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.add-btn{width:100%;padding:15px;background:#1D9E75;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;font-family:inherit;letter-spacing:0.2px;}
.add-btn:active{opacity:0.85;}
.result{display:none;margin-top:12px;background:#e8f8f2;border-radius:12px;padding:12px 14px;}
.result-row{display:flex;gap:0;}
.res-item{flex:1;padding:0 10px;}
.res-item:first-child{padding-left:0;}
.res-item+.res-item{border-left:1.5px solid #a8e6cf;}
.res-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;color:#0F6E56;margin-bottom:2px;}
.res-val{font-size:15px;font-weight:700;color:#0F6E56;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:14px;padding:14px;}
.stat-val{font-size:22px;font-weight:700;color:#000;letter-spacing:-0.5px;}
.stat-lbl{font-size:11px;color:#8e8e93;margin-top:2px;font-weight:500;}
.stat.wide{grid-column:span 2;}
.sec-lbl{font-size:13px;font-weight:600;color:#8e8e93;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;padding:0 4px;}
.hist-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.entry{padding:14px 16px;border-bottom:1px solid #f2f2f7;}
.entry:last-child{border-bottom:none;}
.entry:active{background:#f9f9f9;}
.e-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.e-date{font-size:15px;font-weight:600;color:#000;}
.e-sal{font-size:17px;font-weight:700;color:#000;}
.e-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;}
.b-wk{background:#dbeafe;color:#1d4ed8;}
.b-we{background:#ede9fe;color:#5b21b6;}
.b-ph{background:#fef3c7;color:#92400e;}
.e-meta{font-size:12px;color:#8e8e93;}
.del-btn{background:none;border:none;cursor:pointer;color:#c7c7cc;padding:4px;font-size:18px;margin-left:auto;line-height:1;}
.del-btn:active{color:#ff3b30;}
.empty{padding:32px 16px;text-align:center;color:#8e8e93;font-size:14px;line-height:1.8;}
.empty-icon{font-size:32px;margin-bottom:8px;}

/* total + CPF section */
.summary-card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #f2f2f7;}
.summary-row:last-child{border-bottom:none;}
.summary-lbl{font-size:14px;color:#3c3c43;font-weight:500;}
.summary-val{font-size:15px;font-weight:600;color:#000;font-variant-numeric:tabular-nums;}
.summary-val.deduct{color:#ff3b30;}
.net-bar{display:flex;justify-content:space-between;align-items:center;background:#000;color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;}
.net-lbl-wrap{display:flex;flex-direction:column;gap:2px;}
.net-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;opacity:0.5;}
.net-sub{font-size:11px;opacity:0.4;}
.net-amt{font-size:28px;font-weight:800;letter-spacing:-1px;}

.toast{background:#333;color:#fff;border-radius:10px;padding:10px 16px;text-align:center;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.3s;margin-bottom:8px;pointer-events:none;}
.toast.on{opacity:1;}
</style>

<div id="wrap">
  <div class="hdr">
    <div class="hdr-title">💰 Salary</div>
    <div class="hdr-right">
      <button class="ico-btn imp" onclick="document.getElementById('fi').click()" title="Import Excel">⬆️</button>
      <button class="ico-btn exp" onclick="exportExcel()" title="Export Excel">⬇️</button>
    </div>
  </div>
  <input type="file" id="fi" accept=".xlsx" style="display:none" onchange="importExcel(event)">

  <div class="hint">📥 <b>Import</b> to load a previous month &nbsp;·&nbsp; 📤 <b>Export</b> to save your Excel report</div>

  <div class="card">
    <div class="fld">
      <div class="fld-label">Date</div>
      <input type="date" id="i-date">
    </div>
    <div class="fld">
      <div class="fld-label">Day type</div>
      <select id="i-type">
        <option value="13">📅 Weekday — $13/hr</option>
        <option value="16">🗓️ Weekend — $16/hr</option>
        <option value="19.5">🎉 Public Holiday — $19.50/hr</option>
      </select>
    </div>
    <div class="fld">
      <div class="fld-label">Working hours</div>
      <div class="row2">
        <input type="time" id="i-start" placeholder="Start">
        <input type="time" id="i-end" placeholder="End">
      </div>
    </div>
    <div class="fld">
      <div class="fld-label">Break time (hours)</div>
      <input type="number" id="i-brk" min="0" step="0.25" value="0" inputmode="decimal" placeholder="0">
    </div>
    <button class="add-btn" onclick="addEntry()">+ Add Entry</button>
    <div class="result" id="result">
      <div class="result-row">
        <div class="res-item"><div class="res-lbl">Worked</div><div class="res-val" id="r-hrs">—</div></div>
        <div class="res-item"><div class="res-lbl">Break</div><div class="res-val" id="r-brk">—</div></div>
        <div class="res-item"><div class="res-lbl">Earned</div><div class="res-val" id="r-earn">—</div></div>
      </div>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="stat-val" id="s-shifts">0</div><div class="stat-lbl">Total shifts</div></div>
    <div class="stat"><div class="stat-val" id="s-hrs">0h</div><div class="stat-lbl">Total hours</div></div>
  </div>

  <div class="sec-lbl">History</div>
  <div class="hist-card"><div id="hist"></div></div>

  <div class="summary-card" id="summary-card" style="display:none">
    <div class="summary-row">
      <span class="summary-lbl">Total salary</span>
      <span class="summary-val" id="sum-gross">$0.00</span>
    </div>
    <div class="summary-row">
      <span class="summary-lbl">CPF deduction <span style="font-size:12px;color:#8e8e93;font-weight:400;">(20%)</span></span>
      <span class="summary-val deduct" id="sum-cpf">−$0.00</span>
    </div>
  </div>

  <div class="net-bar" id="net-bar" style="display:none">
    <div class="net-lbl-wrap">
      <span class="net-lbl">Net salary</span>
      <span class="net-sub">after CPF 20%</span>
    </div>
    <span class="net-amt" id="net-amt">$0.00</span>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
let recs=[];

(function init(){
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  document.getElementById('i-date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  render();
})();

function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let a=sh*60+sm,b=eh*60+em;if(b<=a)b+=1440;return(b-a)/60;
}

function fmtD(str){
  if(!str)return'';const[y,m,d]=str.split('-');
  return`${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`;
}

function typeOf(r){
  const v=parseFloat(r);
  if(v===13)return['Weekday','b-wk'];
  if(v===16)return['Weekend','b-we'];
  return['P.Holiday','b-ph'];
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2200);
}

function addEntry(){
  const date=document.getElementById('i-date').value;
  const s=document.getElementById('i-start').value;
  const e=document.getElementById('i-end').value;
  const brk=parseFloat(document.getElementById('i-brk').value)||0;
  const rate=parseFloat(document.getElementById('i-type').value);
  if(!date||!s||!e){alert('Please fill in date, start time and end time.');return;}
  const raw=calcH(s,e),hrs=Math.max(0,raw-brk),earn=hrs*rate;
  recs.unshift({id:Date.now(),date,s,e,brk,rate,hrs,earn});
  const rs=document.getElementById('result');rs.style.display='block';
  document.getElementById('r-hrs').textContent=`${raw.toFixed(2)}h`;
  document.getElementById('r-brk').textContent=brk>0?`-${brk.toFixed(2)}h`:'0h';
  document.getElementById('r-earn').textContent=`$${earn.toFixed(2)}`;
  render();toast('✅ Entry added!');
}

function del(id){
  if(!confirm('Delete this entry?'))return;
  recs=recs.filter(r=>r.id!==id);render();
}

function render(){
  const h=document.getElementById('hist'),sg=document.getElementById('stats');
  const sc=document.getElementById('summary-card'),nb=document.getElementById('net-bar');
  if(!recs.length){
    h.innerHTML='<div class="empty"><div class="empty-icon">📋</div>No entries yet.<br>Add a shift above or<br>import an Excel file.</div>';
    sc.style.display='none';nb.style.display='none';sg.style.display='none';return;
  }
  sg.style.display='grid';sc.style.display='block';nb.style.display='flex';
  let tot=0,totH=0,html='';
  recs.forEach(r=>{
    tot+=parseFloat(r.earn);totH+=parseFloat(r.hrs);
    const[lbl,cls]=typeOf(r.rate);
    html+=`<div class="entry">
      <div class="e-top"><span class="e-date">${fmtD(r.date)}</span><span class="e-sal">$${parseFloat(r.earn).toFixed(2)}</span></div>
      <div class="e-bot">
        <span class="badge ${cls}">${lbl}</span>
        <span class="e-meta">${parseFloat(r.hrs).toFixed(2)}h · $${parseFloat(r.rate)}/hr</span>
        ${r.brk>0?`<span class="e-meta">−${parseFloat(r.brk).toFixed(2)}h break</span>`:''}
        <button class="del-btn" onclick="del(${r.id})">🗑️</button>
      </div>
    </div>`;
  });
  h.innerHTML=html;
  document.getElementById('s-shifts').textContent=recs.length;
  document.getElementById('s-hrs').textContent=`${totH.toFixed(1)}h`;

  const cpf=tot*0.20;
  const net=tot-cpf;
  document.getElementById('sum-gross').textContent=`$${tot.toFixed(2)}`;
  document.getElementById('sum-cpf').textContent=`−$${cpf.toFixed(2)}`;
  document.getElementById('net-amt').textContent=`$${net.toFixed(2)}`;
}

function exportExcel(){
  if(!recs.length){alert('No entries to export.');return;}
  const wb=XLSX.utils.book_new();
  const rows=[['ID','Date','Start','End','Break (hrs)','Rate ($/hr)','Hours','Salary ($)','Type']];
  recs.forEach(r=>{const[lbl]=typeOf(r.rate);rows.push([r.id,r.date,r.s,r.e,+r.brk,+r.rate,+parseFloat(r.hrs).toFixed(2),+parseFloat(r.earn).toFixed(2),lbl]);});
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[16,12,8,8,12,12,10,12,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,'Records');

  const sorted=[...recs].sort((a,b)=>a.date.localeCompare(b.date));
  const tot=recs.reduce((s,r)=>s+parseFloat(r.earn),0);
  const totH=recs.reduce((s,r)=>s+parseFloat(r.hrs),0);
  const cpf=tot*0.20;
  const net=tot-cpf;
  const fd=sorted[0]?.date||'',ld=sorted[sorted.length-1]?.date||'';
  const sum=[
    ['SALARY REPORT'],[''],
    ['Period',`${fmtD(fd)} – ${fmtD(ld)}`],
    ['Generated',new Date().toLocaleDateString('en-MY')],[''],
    ['Total shifts',recs.length],
    ['Total hours',+totH.toFixed(2)],
    [''],
    ['Gross salary ($)',+tot.toFixed(2)],
    ['CPF deduction (20%) ($)',+cpf.toFixed(2)],
    ['Net salary ($)',+net.toFixed(2)],
    [''],
    ['Weekday shifts',recs.filter(r=>+r.rate===13).length],
    ['Weekend shifts',recs.filter(r=>+r.rate===16).length],
    ['Public holiday shifts',recs.filter(r=>+r.rate===19.5).length],
  ];
  const ws2=XLSX.utils.aoa_to_sheet(sum);
  ws2['!cols']=[{wch:26},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws2,'Summary');
  const d=new Date(fd);
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  XLSX.writeFile(wb,`Salary_${mo[d.getMonth()]}_${d.getFullYear()}.xlsx`);
  toast('📤 Excel exported!');
}

function importExcel(ev){
  const file=ev.target.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets['Records'];
      if(!ws){alert('No "Records" sheet found. Use a file exported from this app.');return;}
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      const imp=[];
      for(let i=1;i<rows.length;i++){
        const[id,date,s,e2,brk,rate,hrs,earn]=rows[i];
        if(!date||!s||!e2)continue;
        imp.push({id:id||Date.now()+i,date,s,e:e2,brk:+brk||0,rate:+rate,hrs:+hrs,earn:+earn});
      }
      if(!imp.length){alert('No valid records found.');return;}
      recs=imp;document.getElementById('result').style.display='none';
      render();toast(`📥 Imported ${imp.length} entries`);
    }catch(err){alert('Could not read the file.');}
  };
  fr.readAsBinaryString(file);ev.target.value='';
}
</script>
